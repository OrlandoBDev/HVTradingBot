name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  solution:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HVTradingBot.sln

      - name: Build
        run: dotnet build HVTradingBot.sln --no-restore -c Release

      # Integration tests start PostgreSQL with Testcontainers; the runner has Docker.
      - name: Test
        run: dotnet test HVTradingBot.sln --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  web:
    # The .NET build does not need the dashboard, but the api Docker image builds it (npm ci + npm run build).
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/HVTradingBot.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/HVTradingBot.Web/package-lock.json

      - run: npm ci
      - run: npm run build

  mac-app:
    # apps/HVTradingBot.App is not in HVTradingBot.sln (MAUI cannot build on Linux); this job shows whether it builds.
    name: macOS app build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the MAUI workload
        run: dotnet workload install maui

      - name: Build the Mac Catalyst app
        run: dotnet build apps/HVTradingBot.App/HVTradingBot.App.csproj -f net10.0-maccatalyst -c Release
