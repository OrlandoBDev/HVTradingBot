services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hvtradingbot
      POSTGRES_USER: hvtradingbot
      POSTGRES_PASSWORD: dev-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - hvtradingbot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvtradingbot -d hvtradingbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  hvtradingbot-postgres:
